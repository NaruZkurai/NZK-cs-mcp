# NZK-cs-mcp — the v3 csgraph engine + `csgraph --mcp` stdio server.
# The engine mirrors the v3 GUI viewer (https://github.com/NaruZkurai/nzk-cs-viewer),
# which consumes this engine as `csgraph-core`.
[workspace]
resolver = "2"
members = ["core"]

[workspace.package]
version = "3.0.0-beta.9"
edition = "2024"
license = "MIT"
repository = "https://github.com/NaruZkurai/NZK-cs-mcp"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
